name: Build visionOS Framework

# Builds GodotRealityKit.framework for visionOS on an Apple Silicon runner
# (GitHub's macos-15 image) and uploads it as a downloadable artifact.
#
# This exists because visionOS Swift/xcodebuild builds require the visionOS
# platform, which Apple does not ship for Intel Macs. Run this whenever the
# plugin source changes; drop the resulting framework into the app repo at
#   godotrealitykit-demo-build/godotrealitykit-demo/dylibs/addons/GodotRealityKit/visionos.template_debug/
# The app's own CI (Xcode Cloud) then just links the prebuilt binary.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Build configuration"
        type: choice
        default: debug
        options: [debug, release]
  push:
    branches: [main]
    paths:
      - "godotrealitykit/**"
      - ".github/workflows/build-visionos-framework.yml"

jobs:
  # Fast fail: catch environment problems (wrong Xcode, missing visionOS SDK)
  # in under a minute instead of ~35 min into the Godot compile.
  preflight:
    runs-on: macos-15
    outputs:
      xcode: ${{ steps.pick.outputs.xcapp }}
    steps:
      - name: Pick and validate Xcode 26.x + visionOS SDK
        id: pick
        run: |
          set -e
          XCAPP=$(ls -d /Applications/Xcode_26.[0-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XCAPP" ] || { echo "::error::No Xcode 26.x on runner"; exit 1; }
          sudo xcode-select -s "$XCAPP/Contents/Developer"
          echo "Using: $XCAPP"
          xcodebuild -version
          V=$(xcodebuild -version | awk 'NR==1{print $2}')
          case "$V" in 26.*) ;; *) echo "::error::Xcode $V is not 26.x"; exit 1;; esac
          xcrun --sdk xros --show-sdk-path || { echo "::error::visionOS SDK missing"; exit 1; }
          xcodebuild -showsdks | grep -i 'xros\|visionos' || { echo "::error::no visionOS SDK listed"; exit 1; }
          echo "xcapp=$XCAPP" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 150
    defaults:
      run:
        working-directory: godotrealitykit

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          sudo xcode-select -s '${{ needs.preflight.outputs.xcode }}/Contents/Developer'
          xcodebuild -version

      - name: Ensure visionOS platform + Metal toolchain
        run: |
          set -x
          xcrun --sdk xros --show-sdk-path || xcodebuild -downloadPlatform visionOS
          xcodebuild -downloadComponent MetalToolchain || \
            xcodebuild -downloadComponent metalToolchain || true

      - name: Install SCons
        run: |
          brew install scons
          scons --version

      - name: Restore built dependencies (Godot + godot-cpp)
        id: depcache
        uses: actions/cache/restore@v4
        with:
          path: godotrealitykit/out/shared_workspace
          key: gdrk-deps-v3-${{ runner.os }}-${{ hashFiles('godotrealitykit/deps.conf') }}
          restore-keys: |
            gdrk-deps-v3-${{ runner.os }}-

      - name: Build dependencies (Godot + godot-cpp for visionOS)
        if: steps.depcache.outputs.cache-hit != 'true'
        run: scons deps -j$(sysctl -n hw.ncpu)

      - name: Prune workspace so it fits GitHub's 10 GB cache limit
        if: steps.depcache.outputs.cache-hit != 'true'
        run: |
          set -x
          WS=out/shared_workspace
          du -sh "$WS" || true
          # Cloned dep repos: keep the source + built libs, drop git history.
          find "$WS" -type d -name .git -prune -exec rm -rf {} + || true
          # Godot object files are already archived into libgodot.*.a — not
          # needed by the framework's xcodebuild step.
          find "$WS" -type d -name obj -path '*godot*/bin/*' -prune -exec rm -rf {} + || true
          find "$WS" -type f -name '*.o' -delete || true
          # xcodebuild derived-data intermediates for the deps stage.
          find "$WS" -type d -name 'Intermediates.noindex' -prune -exec rm -rf {} + || true
          find "$WS" -type d -name 'ModuleCache.noindex' -prune -exec rm -rf {} + || true
          du -sh "$WS" || true

      # Save the pruned deps immediately, before the framework step, so a
      # failure there never forces another ~50-min deps rebuild.
      - name: Save built dependencies
        if: steps.depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: godotrealitykit/out/shared_workspace
          key: gdrk-deps-v3-${{ runner.os }}-${{ hashFiles('godotrealitykit/deps.conf') }}

      - name: Build visionOS framework
        run: |
          CFG='${{ github.event.inputs.config || 'debug' }}'
          if [ "$CFG" = "release" ]; then
            scons framework platform=visionos config=release -j$(sysctl -n hw.ncpu)
          else
            scons framework platform=visionos -j$(sysctl -n hw.ncpu)
          fi

      - name: Locate and verify the framework
        id: fw
        run: |
          set -e
          BASE=out/addons/GodotRealityKit
          if [ -d "$BASE/visionos.template_release/GodotRealityKit.framework" ]; then
            DIR="$BASE/visionos.template_release"
          else
            DIR="$BASE/visionos.template_debug"
          fi
          FW="$DIR/GodotRealityKit.framework"
          echo "Framework: $FW"
          test -d "$FW"
          vtool -show-build "$FW/GodotRealityKit" | tee /tmp/vtool.txt
          grep -q 'platform VISIONOS' /tmp/vtool.txt || { echo "::error::Framework is not a visionOS build"; exit 1; }
          tar -czf "$RUNNER_TEMP/GodotRealityKit.framework.tgz" -C "$DIR" GodotRealityKit.framework

      - name: Upload framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodotRealityKit-visionos-framework
          path: ${{ runner.temp }}/GodotRealityKit.framework.tgz
          if-no-files-found: error
          retention-days: 30
